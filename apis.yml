aid: sceneray
name: SceneRay
description: >-
  SceneRay Medical Technology (Suzhou) Co., Ltd. is a Chinese medical-device and
  brain-computer-interface company founded in 2011 and headquartered in the Suzhou
  Industrial Park. It designs and manufactures implantable neuromodulation systems,
  focusing on Deep Brain Stimulation (DBS) devices and "brain-machine control chip"
  technology used to treat Parkinson's disease, movement disorders, epilepsy, and
  treatment-resistant psychiatric conditions. Its product line spans implantable
  pulse generators, programmable external controllers, and clinician programming
  systems. SceneRay reports over 100 international patents and 700+ total patent
  applications, with devices used across 18+ countries. It was surfaced in the API
  Evangelist network as a portfolio company of the venture firm Qiming. As a medical
  hardware manufacturer, SceneRay publishes no public developer portal, API, SDK, or
  other machine-readable technical surface at the time of this enrichment pass.
